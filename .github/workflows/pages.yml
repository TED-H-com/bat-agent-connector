name: Deploy project page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "desktop/prototype/**"
      - "desktop/demo/**"
      - "desktop/src/**"
      - "desktop/tests/demo/**"
      - "desktop/package*.json"
      - "scripts/*product_site*"
      - "README*.md"
      - "docs/getting-started*.md"
      - "docs/design/managed-installation.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "desktop/prototype/**"
      - "desktop/demo/**"
      - "desktop/src/**"
      - "desktop/tests/demo/**"
      - "desktop/package*.json"
      - "scripts/*product_site*"
      - "README*.md"
      - "docs/getting-started*.md"
      - "docs/design/managed-installation.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate product website
    runs-on: ubuntu-24.04
    # Allow slow mirror/setup work without consuming the website verification budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the pinned screenshot source commit
        run: |
          commit=$(python3 -c 'import json; print(json.load(open("site/images/manifest.json"))["frontend_source_commit"])')
          git fetch --no-tags --depth=1 origin "$commit"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Browser verification dependencies
        working-directory: desktop
        run: npm ci
      - name: Read Playwright version
        id: playwright
        working-directory: desktop
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium by Playwright version
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Bound stalled apt downloads
        run: |
          # APT applies Timeout to connection and data waits; retry a failed file once.
          sudo tee /etc/apt/apt.conf.d/99-playwright-ci > /dev/null <<'EOF'
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF
      - name: Chromium system dependencies
        working-directory: desktop
        run: npx playwright install-deps chromium
      - name: Install Chromium
        working-directory: desktop
        run: npx playwright install chromium
      - name: Build and validate the unindexed prototype
        working-directory: desktop
        run: |
          npm run build:prototype
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit


          class PrototypeBuild(HTMLParser):
              noindex = False

              def handle_starttag(self, tag, attributes):
                  attrs = dict(attributes)
                  if tag == "meta" and attrs.get("name", "").lower() == "robots":
                      self.noindex |= "noindex" in attrs.get("content", "").lower().replace(",", " ").split()
                  urls = [attrs[key] for key in ("src", "poster", "data") if key in attrs]
                  if tag == "link" and "href" in attrs:
                      urls.append(attrs["href"])
                  if "srcset" in attrs:
                      urls.extend(entry.strip().split()[0] for entry in attrs["srcset"].split(",") if entry.strip())
                  for url in urls:
                      if not url or url.startswith(("/", "\\")) or urlsplit(url).scheme or urlsplit(url).netloc:
                          raise ValueError(f"Asset URL must be relative: {url}")


          check = PrototypeBuild()
          check.feed(Path("dist-prototype/v1.3/index.html").read_text())
          if not check.noindex:
              raise ValueError("Prototype must include a robots noindex meta tag")
          print("Prototype build: noindex and relative asset URLs verified")
          PY
      - name: Build and verify the shared Dashboard demo
        working-directory: desktop
        run: |
          npm run build:demo
          npm run build:browser
          npx playwright test tests/public-demo.spec.ts
      - name: Stage interactive examples and check website links
        run: |
          mkdir -p site/demo site/prototype/v1.3
          cp -R desktop/dist-demo/. site/demo/
          cp -R desktop/dist-prototype/v1.3/. site/prototype/v1.3/
          python3 scripts/build_product_site.py --check
          python3 scripts/check_product_site.py
      - name: Responsive bilingual browser checks
        env:
          SITE_SCREENSHOT_DIR: ${{ runner.temp }}/product-site-evidence
        run: node scripts/verify_product_site.mjs
      - name: Save website screenshots and receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: product-site-evidence
          path: ${{ runner.temp }}/product-site-evidence
          if-no-files-found: ignore

  deploy:
    name: Deploy static site
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build the shared demo and workflow preview
        working-directory: desktop
        run: |
          npm ci
          npm run build:prototype
          npm run build:demo

      - name: Stage the interactive examples
        run: |
          mkdir -p site/demo site/prototype/v1.3
          cp -R desktop/dist-prototype/v1.3/. site/prototype/v1.3/
          cp -R desktop/dist-demo/. site/demo/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
