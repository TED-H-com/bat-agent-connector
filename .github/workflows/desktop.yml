env:
  BATC_BUILD_COMMIT: ${{ inputs.source_sha || github.sha }}

permissions:
  contents: read

concurrency:
  # Unique push groups also preserve pending main runs, not just running ones.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.select.outputs.native }}
      builds: ${{ steps.select.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR checkout is refs/pull/N/merge; its first parent is the target branch tip.
          fetch-depth: 2
          persist-credentials: false
      - name: Select native builds from the PR merge diff
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          paths="$RUNNER_TEMP/ci-scope-paths.txt"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if git -c core.quotepath=false diff --no-renames --name-only HEAD^1 HEAD > "$paths"; then
              python3 scripts/ci_scope.py --workflow desktop --event-name "$EVENT_NAME" < "$paths" >> "$GITHUB_OUTPUT"
            else
              python3 scripts/ci_scope.py --workflow desktop --event-name "$EVENT_NAME" --diff-failed < /dev/null >> "$GITHUB_OUTPUT"
            fi
          else
            python3 scripts/ci_scope.py --workflow desktop --event-name "$EVENT_NAME" < /dev/null >> "$GITHUB_OUTPUT"
          fi

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # check:browser compares to Git; regenerate first to actually detect source drift.
      - run: npm run build:browser
      - name: Check generated browser assets
        run: npm run check:browser
      - run: npm test

  browser-ui:
    name: browser-ui (${{ matrix.shard }}/5)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      TZ: UTC
      PLAYWRIGHT_HTML_OPEN: never
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium by Playwright version
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Bound stalled apt downloads
        uses: ./.github/actions/bounded-apt
        with:
          package-set: playwright-chromium-fonts
          package-set-hash: ${{ hashFiles('desktop/package-lock.json', '.github/workflows/desktop.yml') }}
      - name: Chromium dependencies and existing DejaVu font environment
        run: |
          npx playwright install-deps chromium
          sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra
      - run: npx playwright install chromium
      - name: Font environment diagnostics
        run: |
          fc-match system-ui
          fc-match sans-serif
          fc-list | wc -l
      # The static server reads the committed dashboard assets; no Vite/native build needed.
      - name: Shared browser and native-transport UI tests
        run: npx playwright test --shard=${{ matrix.shard }}/5 --reporter=line,html
      - name: Preserve failed browser UI evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-ui-${{ matrix.shard }}
          path: |
            desktop/test-results/
            desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  central-ui:
    runs-on: ubuntu-24.04
    # Five minutes for setup and a shared ten-minute script budget below.
    # PM walkthrough retains its separate two-minute script budget.
    timeout-minutes: 20
    env:
      TZ: UTC
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Prepare central service fixtures
        working-directory: .
        run: uv sync --locked --extra dev
      - run: npm ci
      - name: Bound stalled apt downloads
        uses: ./.github/actions/bounded-apt
        with:
          package-set: playwright-chromium
          package-set-hash: ${{ hashFiles('desktop/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Start shared ten-minute UI script budget
        run: echo "BATC_CENTRAL_UI_DEADLINE=$(($(date +%s) + 600))" >> "$GITHUB_ENV"
      - name: test:central
        run: bash scripts/ci-central-ui.sh test:central
      - name: test:two-service-isolation
        run: bash scripts/ci-central-ui.sh test:two-service-isolation
      - name: test:managed-recovery-reset
        run: bash scripts/ci-central-ui.sh test:managed-recovery-reset
      - name: test:pm
        run: bash scripts/ci-central-ui.sh test:pm
      - name: test:cleanup
        run: bash scripts/ci-central-ui.sh test:cleanup
      - name: test:task-cleanup
        run: bash scripts/ci-central-ui.sh test:task-cleanup
      - name: test:task-controls
        run: bash scripts/ci-central-ui.sh test:task-controls
      - name: test:artifacts
        run: bash scripts/ci-central-ui.sh test:artifacts
      - name: test:delivery
        run: bash scripts/ci-central-ui.sh test:delivery
      - name: test:observation
        run: bash scripts/ci-central-ui.sh test:observation
      - name: test:capture
        run: bash scripts/ci-central-ui.sh test:capture
      - name: test:artifact-review
        run: bash scripts/ci-central-ui.sh test:artifact-review
      - name: test:artifact-review -- --start
        run: bash scripts/ci-central-ui.sh test:artifact-review -- --start
      - name: test:permissions
        run: bash scripts/ci-central-ui.sh test:permissions
      - name: test:approvals
        run: bash scripts/ci-central-ui.sh test:approvals
      - name: test:start
        run: bash scripts/ci-central-ui.sh test:start
      - name: test:published
        run: bash scripts/ci-central-ui.sh test:published
      - name: test:dispatch
        run: bash scripts/ci-central-ui.sh test:dispatch
      - name: test:orchestration
        run: bash scripts/ci-central-ui.sh test:orchestration
      - name: test:labels
        run: bash scripts/ci-central-ui.sh test:labels
      - name: test:attention
        run: bash scripts/ci-central-ui.sh test:attention
      - name: PM decision walkthrough with actual central service (English)
        timeout-minutes: 2
        env:
          BATC_WALKTHROUGH_SHOTS: test-results/walkthrough
        run: npm run test:walkthrough -- --locale=en
      - name: PM decision walkthrough with actual central service (zh-TW)
        timeout-minutes: 2
        env:
          BATC_WALKTHROUGH_SHOTS: test-results/walkthrough
        run: npm run test:walkthrough -- --locale=zh-TW
      - name: Preserve shared UI fixture evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-shared-ui-fixtures
          path: |
            desktop/test-results/
            desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  work-loop:
    name: work-loop (${{ matrix.part }})
    runs-on: ubuntu-24.04
    # Allow twelve minutes for mirror/setup variance and evidence upload;
    # each partition retains the separate three-minute script cap.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: work
            selection: not fixed_result and not foreground_recovery and not lost_start_reply and not refused_access and not other_form_refusal and not discussion_adopt_start and not browser_credentials
          - part: adoption
            selection: discussion_adopt_start
          - part: evidence
            selection: fixed_result or other_form_refusal
          - part: recovery
            selection: foreground_recovery or lost_start_reply or refused_access
          - part: credentials
            selection: browser_credentials
    env:
      TZ: UTC
      BATC_WORK_LOOP_BROWSER: "1"
      WORK_LOOP_SELECTION: ${{ matrix.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: npm ci
        working-directory: desktop
      - name: Read Playwright version
        id: playwright
        working-directory: desktop
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium by Playwright version
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Bound stalled apt downloads
        uses: ./.github/actions/bounded-apt
        with:
          package-set: playwright-chromium
          package-set-hash: ${{ hashFiles('desktop/package-lock.json') }}
      - name: Chromium system dependencies
        working-directory: desktop
        run: npx playwright install-deps chromium
      - name: Install Chromium
        working-directory: desktop
        run: npx playwright install chromium
      - name: Work loop through actual central
        timeout-minutes: 3
        run: |
          mkdir -p "$HOME/agent-work/tmp/pytest"
          loop_temp=$(mktemp -d "$HOME/agent-work/tmp/pytest/work-loop-XXXXXX")
          trap 'rm -rf -- "$loop_temp"' EXIT
          uv run --extra dev pytest -q tests/test_pm_work_loop_browser.py tests/test_managed_setup_browser.py tests/test_browser_credentials_browser.py -k "$WORK_LOOP_SELECTION" --basetemp="$loop_temp/bt"
      - name: Preserve Work loop evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-work-loop-${{ matrix.part }}
          path: |
            desktop/test-results/work-loop/
            desktop/test-results/managed-setup-reading/
            desktop/test-results/credential-service/
            desktop/test-results/credential-service.log
          if-no-files-found: ignore
          retention-days: 7

  windows-endpoint-oracle:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # master (toolchain pinned below)
        with:
          toolchain: "1.98.1"
      - name: Temporary loopback absence oracle (no installed services)
        run: cargo test --locked --manifest-path desktop/fleet-core/Cargo.toml --lib windows_tunnel::tests::system_path_and_occupied_listener_are_fixed_and_read_only -- --exact --nocapture
      - name: Fleet contracts and owned Windows fixtures (continue through independent targets)
        run: cargo test --locked --manifest-path desktop/fleet-core/Cargo.toml --no-fail-fast
  build:
    name: build (${{ matrix.os }}, ${{ matrix.bundle }}, ${{ matrix.artifact }})
    needs: scope
    if: ${{ needs.scope.outputs.native != 'none' }}
    strategy:
      fail-fast: false
      # Include-only matrix: exactly the selected entries, with no Cartesian axes.
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.builds) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # master (toolchain pinned below)
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: Bound apt for Linux native libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/bounded-apt
        with:
          package-set: native-linux
          package-set-hash: ${{ hashFiles('desktop/package-lock.json', '.github/workflows/desktop.yml') }}
      - name: Linux native build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xdotool x11-utils dbus-x11 python3-pil
      - run: npm ci
      - run: npm run build
      - name: Bound apt for packaged Chromium
        if: runner.os == 'Linux'
        uses: ./.github/actions/bounded-apt
        with:
          package-set: native-linux
          package-set-hash: ${{ hashFiles('desktop/package-lock.json', '.github/workflows/desktop.yml') }}
      - name: Chromium for packaged managed setup
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Prepare central service fixtures
        working-directory: .
        run: uv sync --locked --extra dev --extra desktop-build
      - name: Windows central locking, private storage and artifact fixtures
        if: runner.os == 'Windows'
        working-directory: .
        run: uv run --locked --extra dev python desktop/tests/windows-central-fixture.py
      - name: Build the matching self-contained managed central runtime
        working-directory: .
        run: uv run --locked --extra desktop-build python desktop/scripts/build-managed-runtime.py
      - name: Packaged central clean-profile, concurrent owner and restart fixture (no Python on child PATH)
        working-directory: .
        timeout-minutes: 8
        run: uv run --locked --extra desktop-build python desktop/tests/managed-runtime-fixture.py
      - name: Check out the fixed earlier core upgrade baseline (0.2.6)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f31e7964c627e4b6d3af2e2370e7a38c64a20e25
          path: .upgrade-baseline
          persist-credentials: false
      - name: Build the original earlier core from its own locked environment
        working-directory: .upgrade-baseline
        timeout-minutes: 8
        run: uv run --python 3.13 --locked --extra desktop-build python desktop/scripts/build-managed-runtime.py
      - name: Distinct packaged core upgrade retains identity, workspace and original intents
        working-directory: .
        timeout-minutes: 8
        run: uv run --locked --extra dev --extra desktop-build python desktop/tests/managed-upgrade-fixture.py --previous-resources .upgrade-baseline/desktop/managed-runtime --current-resources desktop/managed-runtime --previous-source .upgrade-baseline --receipt desktop/test-results/packaged-core-upgrade.json
      - name: Preserve packaged core upgrade evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packaged-core-upgrade-${{ matrix.os }}
          path: |
            desktop/test-results/packaged-core-upgrade.json
            desktop/test-results/packaged-core-upgrade/
          if-no-files-found: ignore
          retention-days: 7
      - name: Packaged managed setup with real browser and MockBAT
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: node tests/managed-setup-browser-integration.mjs
      - name: Preserve packaged managed setup evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-managed-setup-fixture
          path: |
            desktop/test-results/
            desktop/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Verify reviewed GLib source and actual Linux dependency graph
        if: runner.os == 'Linux'
        run: python3 ../scripts/check_glib_backport.py --target x86_64-unknown-linux-gnu
      - name: Verify GLib is absent from the Windows dependency graph
        if: runner.os == 'Windows'
        run: python ../scripts/check_glib_backport.py --target x86_64-pc-windows-msvc
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Native unit and integration tests with failure diagnostics
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets -- --nocapture
      - name: Actual macOS Keychain persistence (isolated disposable keychain)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: node tests/macos-keychain.mjs
      - name: GLib iterator regression with compiler optimizations
        if: runner.os == 'Linux'
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --test glib_variant_iter
      - name: Native Fleet contracts, wire peers and owned Windows process fixtures
        run: |
          cargo fmt --manifest-path fleet-core/Cargo.toml --check
          cargo clippy --locked --manifest-path fleet-core/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path fleet-core/Cargo.toml --no-fail-fast
      - name: Rust request oracle and unchanged Python handoff requests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked --manifest-path fleet-core/Cargo.toml --example participant_request_oracle
          export BATC_PARTICIPANT_REQUEST_ORACLE="$PWD/fleet-core/target/debug/examples/participant_request_oracle"
          cd ..
          mkdir -p "$HOME/agent-work/tmp/pytest"
          request_temp=$(mktemp -d "$HOME/agent-work/tmp/pytest/participant-XXXXXX")
          trap 'rm -rf -- "$request_temp"' EXIT
          for version in 3.13 3.10; do
            uv run --isolated --python "$version" --extra dev pytest -q desktop/tests/test_participant_delivery.py --basetemp="$request_temp/$version"
          done
      - name: Native file adapter with actual central service
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: npm run test:native-files
      # Linux and Windows keep this command. macOS is the next step.
      - name: Package app (unsigned validation artifact)
        if: runner.os != 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npm run tauri -- build --bundles ${{ matrix.bundle }} -- --locked
      - name: Package app (unsigned validation artifact)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: bash scripts/package-unsigned-macos.sh "${{ matrix.bundle }}"
      - name: Installed macOS DMG, WebView, Dock reopen and normal Quit fixture
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: node tests/macos-installed-smoke.mjs
      - name: Preserve installed macOS fixture evidence
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-macOS-${{ runner.arch }}-installed-fixture
          path: desktop/test-results/macos-installed/
          if-no-files-found: ignore
      - name: Installed Windows NSIS, WebView, close and reopen fixture
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: node tests/windows-installed-smoke.mjs
      - name: Preserve installed Windows fixture evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-windows-installed-fixture
          path: desktop/test-results/windows-installed/
          if-no-files-found: ignore
      - name: Extracted Linux deb WebView, close-to-tray and single-instance fixture
        if: runner.os == 'Linux'
        timeout-minutes: 2
        env:
          BATC_NATIVE_SMOKE_ARTIFACT_DIR: test-results/native-release
        run: |
          package_root=$(mktemp -d "$RUNNER_TEMP/dashboard-deb-XXXXXX")
          trap 'rm -rf -- "$package_root"' EXIT
          dpkg-deb --extract src-tauri/target/release/bundle/deb/*.deb "$package_root"
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- node tests/native-smoke.mjs "$package_root/usr/bin/better-agent-dashboard"
      - name: Preserve packaged WebView fixture evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-native-release-fixture
          path: desktop/test-results/native-release/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
