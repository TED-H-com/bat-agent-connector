name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Unique push groups also preserve pending main runs, not just running ones.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pythons: ${{ steps.select.outputs.pythons }}
      native: ${{ steps.select.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select coverage from the PR diff (main always gets full coverage)
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          paths="$RUNNER_TEMP/ci-scope-paths.txt"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA" &&
               git -c core.quotepath=false diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$paths"; then
              python3 scripts/ci_scope.py --event-name "$EVENT_NAME" < "$paths" >> "$GITHUB_OUTPUT"
            else
              python3 scripts/ci_scope.py --event-name "$EVENT_NAME" --diff-failed < /dev/null >> "$GITHUB_OUTPUT"
            fi
          else
            python3 scripts/ci_scope.py --event-name "$EVENT_NAME" < /dev/null >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Generated agent skills
        run: uv run python scripts/generate_agent_skills.py --check
      - name: Public content boundaries
        run: uv run python scripts/check_public_content.py

  pytest:
    needs: scope
    name: pytest ${{ matrix.python }} (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    # Twice the slowest predicted job (including overhead), rounded up to 5m.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.scope.outputs.pythons) }}
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: Tests (mock server only; existing live-test policy unchanged)
        run: >-
          uv run pytest -q -p tests.ci_shard_plugin
          --ci-shard-index=${{ matrix.shard }} --ci-shard-count=5
          --ci-shard-manifest=ci-results/manifest.json
          --junitxml=ci-results/junit.xml -o junit_family=xunit1 --durations=15
      - name: Preserve collection proof and JUnit results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pytest-${{ matrix.python }}-${{ matrix.shard }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: error

  pytest-complete:
    needs: [scope, pytest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: pytest-*
          path: ci-results
      - name: Require successful shards and an exact partition on every Python version
        env:
          SHARDS_RESULT: ${{ needs.pytest.result }}
          PYTHONS: ${{ join(fromJSON(needs.scope.outputs.pythons), ' ') }}
        run: >-
          uv run --no-project python -m scripts.ci_complete ci-results
          --python $PYTHONS --shards 5 --shards-result "$SHARDS_RESULT"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --verbose .
