name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Unique push groups also preserve pending main runs, not just running ones.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pythons: ${{ steps.select.outputs.pythons }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR checkout is refs/pull/N/merge; its first parent is the target branch tip.
          fetch-depth: 2
          persist-credentials: false
      - name: Select pytest versions from the PR merge diff
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          paths="$RUNNER_TEMP/ci-scope-paths.txt"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if git -c core.quotepath=false diff --no-renames --name-only HEAD^1 HEAD > "$paths"; then
              python3 scripts/ci_scope.py --workflow ci --event-name "$EVENT_NAME" < "$paths" >> "$GITHUB_OUTPUT"
            else
              python3 scripts/ci_scope.py --workflow ci --event-name "$EVENT_NAME" --diff-failed < /dev/null >> "$GITHUB_OUTPUT"
            fi
          else
            python3 scripts/ci_scope.py --workflow ci --event-name "$EVENT_NAME" < /dev/null >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Generated agent skills
        run: uv run python scripts/generate_agent_skills.py --check
      - name: Public content boundaries
        run: uv run python scripts/check_public_content.py

  connector-update-package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - name: Install and verify a local published-tag fixture in isolated disk storage
        run: >-
          uv run python scripts/validate_connector_update.py
          --receipt "$HOME/agent-work/tmp/update-proof/receipt.json"
      - name: Preserve package verification receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: connector-update-package-proof
          path: ~/agent-work/tmp/update-proof/receipt.json
          if-no-files-found: error
          retention-days: 7

  pytest:
    needs: scope
    name: pytest ${{ matrix.python }} (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    # Twice the slowest predicted job (including overhead), rounded up to 5m.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.scope.outputs.pythons) }}
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: Tests (mock server only; existing live-test policy unchanged)
        # Run 39922072602: max completed Tests 1705s * 1.5 = 42m37.5s < 43m.
        # Max setup 11s + Tests 43m + upload/cleanup reserve 1m < job 45m (post-test max 6s).
        # A step deadline can preserve uploads only while the runner remains healthy.
        timeout-minutes: 43
        shell: bash
        run: |
          mkdir -p ci-results
          # Slowest phase 163.23s * 3 = 489.69s < 600s. One plugin-owned timer spans
          # setup/call/teardown, including failed-call cleanup. Disable the built-in
          # timer: its exception hook cancels dumps before a failed test's teardown.
          uv run pytest -q -p tests.ci_shard_plugin -p no:faulthandler \
            --ci-shard-index=${{ matrix.shard }} --ci-shard-count=5 \
            --ci-shard-manifest=ci-results/manifest.json \
            --junitxml=ci-results/junit.xml -o junit_family=xunit1 --durations=15 \
            --ci-watchdog-seconds=600 \
            2> >(tee ci-results/tracebacks.log >&2) | tee ci-results/pytest.log
      - name: Preserve collection proof, progress, tracebacks and JUnit results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pytest-${{ matrix.python }}-${{ matrix.shard }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: error

  pytest-complete:
    needs: [scope, pytest, native-isolation]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: pytest-*
          path: ci-results
      - name: Require the real coding isolation canary
        env:
          CANARY_RESULT: ${{ needs.native-isolation.result }}
        run: test "$CANARY_RESULT" = success
      - name: Require successful shards and an exact partition on every Python version
        env:
          SHARDS_RESULT: ${{ needs.pytest.result }}
          PYTHONS: ${{ join(fromJSON(needs.scope.outputs.pythons), ' ') }}
        run: >-
          uv run --no-project python -m scripts.ci_complete ci-results
          --python $PYTHONS --shards 5 --shards-result "$SHARDS_RESULT"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --verbose .

  native-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - name: Install bubblewrap and enable user namespaces on this disposable runner only
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap e2fsprogs
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Require the real filesystem and process canary on a bounded disk volume
        env:
          BAC_REQUIRE_BWRAP: "1"
        run: bash scripts/check_native_isolation.sh
