# bat-agent-connector host config. Copy to ~/.config/bat-agent-connector/hosts.toml
# (or generate it with `batc import-bat`). Never put token VALUES in this file.

# Optional private hosts.d/*.toml beside hosts.toml load in filename order (chmod 600).
# Tables merge; scalars/arrays replace. Each host must be defined in only one file.

[client]
# Finite seconds, 1–600; the same keys under [hosts.<name>] override these defaults.
connect_timeout_s = 30                 # WebSocket connect and authentication
invoke_timeout_s = 60                  # minimum default; longer channel deadlines still apply
reconnect_grace_s = 120                # retain subscriptions while transport recovers
# Recovery uses full jitter, 1s exponential base, 60s cap; resets after 60s connected.
label = "BAT Agent Connector"          # how this client appears on the host
human_name = "the user"                # name used in relayed messages and NEED-<NAME> status markers
relay_name = "the assistant"           # who relays (labels the brief as its interpretation)

[safety]
audit_preview_chars = 0                # 0 = audit log stores only sha256 prefix + length of prompts
write_min_interval_s = 60              # min seconds between sends to the same session
max_writes_per_hour = 30               # across all hosts (each write step counts)
max_start_per_call = 4                 # fan-out: max sessions started by one `batc fanout --start`

[bat]
# Where BAT keeps its client profiles (used by token_ref = "bat-profile:<id>")
profiles_dir = "~/.local/share/org.tonyq.better-agent-terminal/profiles"

[hosts.workstation]
# For a slower relayed host, for example: connect_timeout_s = 60, invoke_timeout_s = 120.
url = "wss://127.0.0.1:9876/"          # e.g. an ssh -L tunnel to the host's bat-server
fingerprint = "AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99"
token_ref = "env:BAT_TOKEN_WORKSTATION" # or "file:~/.config/bat-agent-connector/workstation.token"
profile_id = "default"
writes = false                         # tier 2: send/continue/interrupt/answer
orchestrate = false                    # tier 3: start worktree sessions, merge, remove (needs writes)
orchestrate_max_sessions = 4
orchestrate_register_tabs = false      # append a GUI tab via workspace:save (append-only; see SECURITY.md)
default_permission_mode = "default"    # "allow_all" = sessions the connector starts/fails over run like BAT's GUI
                                       # default (Claude bypassPermissions, Codex danger-full-access + never ask),
                                       # and approve_pending / session_set_permissions may raise sessions (needs writes)
auto_cleanup = false                   # deprecated: parses only; never enables cleanup writes
codex_model = ""                       # default model for Codex sessions started/failed over ("" = BAT's default)
managed_roots = []                     # host folders that are the connector's own clones (real paths, no symlinks);
                                       # only there may sessions work in the main checkout and worktree_merge merge
shared_clone_worktrees = true          # legacy: new worktrees may live in a human clone's .bat-worktrees
                                       # (shares its refs); false = only inside managed_roots

[hosts.buildbox]
url = "wss://127.0.0.2:9876/"
fingerprint = "00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF"
token_ref = "bat-profile:buildbox"     # read from BAT's own client token store at connect time

# Optional verified host-account boundary. The operator must establish this trusted auditor channel first.
# [hosts.buildbox.confinement]
# host_account = true
# expected_uid = 2001
# bat_account = "example-bat"
# check_ssh_alias = "example-auditor"    # different account; never the BAT account's login
# check_uid = 2002                     # auditor UID, or 0 for a trusted root alias
# protected_roots = ["/srv/example-personal"]
# check_max_age_s = 300
# check_timeout_s = 10
# check_max_entries = 50000
# bat_port = 9876
# No trusted alias => unknown/check_channel_untrusted; confined Claude falls back to default.
# Exact sudoers rule and hardening: docs/design/confinement.md. Git aliases stay in Task settings.

# /api/v1 on the task daemon (batc serve). See docs/design/api-v1.md.
[api]
inventory_interval_s = 60              # how often each host's sessions are observed (read-only)
stale_after_s = 180                    # rows not observed for this long are marked stale
activity_every = 5                     # transcript/archive activity lookups every Nth refresh
allowed_origins = []                   # extra browser origins (loopback origins are always allowed)

# Optional GitHub delivery (merge PRs and deploy from the Dashboard). See docs/design/delivery.md.
# [github]
# token_ref = "env:GITHUB_TOKEN"
# deployment_reconcile_interval_s = 300 # current run/runtime and unresolved run lookup; minimum 60
# [[github.repos]]
# repository = "owner/name"
# merge_methods = ["squash", "merge"]
# [[deploy.recipes]]
# name = "site-production"
# repository = "owner/name"
# environment = "production"
# mode = "workflow_dispatch"           # or "on_merge"
# workflow = "deploy.yml"
# ref = "main"
# deploy_job = "deploy"
# inputs = { source_sha = "source_sha", operation_id = "operation_id" }
# run_name_contains = "operation_id"
# verification = { kind = "http_json", url = "https://deployment.example/version", version_required = true, health_required = true }

# Optional judgment layer (TypeSafe Jev). OFF unless an API key is in the environment variable below.
# It only refines ambiguous session-state classifications and refines legacy read-only cleanup evaluation; any error or
# timeout falls back to the deterministic result (for cleanup: escalate instead of merge).
# Only short, secret-redacted excerpts are sent.
[jev]
enabled = "auto"                       # auto = on when the key is set; true / false to force
timeout_s = 3.0
# model = "jev-latest"
# base_url = "https://api.typesafe.ai"
# api_key_env = "TYPESAFE_API_KEY"
