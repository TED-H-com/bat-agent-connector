[package]
name = "better-agent-dashboard"
version = "0.1.9"
description = "Better Agent Dashboard desktop client"
authors = ["Better Agent Dashboard contributors"]
edition = "2021"
rust-version = "1.98"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
bat-fleet-core = { path = "../fleet-core" }
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-updater = "=2.13.2"
updater-http = { package = "reqwest", version = "=0.13.5", default-features = false }
minisign-verify = "=0.2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2"
regex = "1"
zeroize = { version = "1", features = ["serde"] }
sha2 = "=0.10.9"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "fs"] }

tauri-plugin-dialog = "=2.8.1"
cap-std = "=4.0.3"
png = "=0.18.1"
base64 = "=0.22.1"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
flate2 = "=1.1.10"

[dev-dependencies]
rand = "=0.10.3"
tauri = { version = "=2.12.1", features = ["test"] }
minisign = "=0.10.0"
tempfile = "=3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security_Credentials", "Win32_Graphics_Gdi", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
winreg = "=0.56.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSString"] }
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
security-framework = "=3.7.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "=0.18.5"

# Exact upstream backport for RUSTSEC-2024-0429; see ../vendor/README.md.
[patch.crates-io]
glib = { path = "../vendor/glib-0.18.5" }
